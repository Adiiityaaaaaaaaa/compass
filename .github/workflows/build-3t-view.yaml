# Builds a shareable Compass desktop app from this branch.
#
# Compass bundles native modules, one of which is Windows only, so a Windows
# build has to run on Windows. This is why the build is here rather than in a
# container: it cannot be cross compiled from Linux.
#
# The result is unsigned. Windows SmartScreen will warn the first time it runs,
# because signing needs MongoDB's certificates, which this fork does not have.
name: Build 3T View app

on:
  push:
    branches: [feat/3t-view]
  workflow_dispatch:
    inputs:
      skip_installer:
        description: 'Skip the installer and produce only the unpacked app'
        required: false
        default: 'false'

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    # Compass is a large monorepo and GitHub runners are modest. The job limit
    # is six hours; this leaves room to see a timeout rather than be killed.
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: 'npm'

      - name: Install npm 11.16.0
        run: npm install -g npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Compile workspace packages
        run: npx lerna run bootstrap

      - name: Package Compass
        env:
          DEBUG: 'hadron*,compass*'
          HADRON_SKIP_INSTALLER: ${{ github.event.inputs.skip_installer || 'false' }}
        run: npm run package-compass

      - name: List what was produced
        if: always()
        shell: bash
        run: ls -la packages/compass/dist || echo "no dist directory"

      - name: Upload the app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compass-3t-view-windows
          path: |
            packages/compass/dist/*.exe
            packages/compass/dist/*.msi
            packages/compass/dist/*.zip
          if-no-files-found: warn
          retention-days: 14
