# Publishes an already built installer as a release, without the file ever
# leaving GitHub.
#
# Build artifacts are served from blob storage and expire; release assets are
# served from the CDN, need no login, and are permanent. Moving the file
# between them locally would mean downloading and re-uploading 180 MB. This
# does it inside GitHub instead, so it takes seconds rather than an hour.
name: Publish a release from a build

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID of the build whose installer should be published'
        required: true
      tag:
        description: 'Tag for the release, e.g. v1.0.0'
        required: true
      title:
        description: 'Release title'
        required: false
        default: 'Compass Query Builder'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
      actions: read # to read the artifact from the other run

    steps:
      - name: Fetch the installer from that build
        uses: actions/download-artifact@v4
        with:
          name: compass-query-builder-setup
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: installer

      - name: Show what was fetched
        run: ls -la installer

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cat > notes.md <<'NOTICE'
          MongoDB Compass with a handful of additions, mostly aimed at the things that are awkward in the stock app.

          ## What is different from upstream Compass

          - **Collection History.** Before a document is deleted, updated or replaced, a local snapshot is kept so it can be put back. There is a Collection History button in the documents toolbar.
          - **Copy and paste a collection.** Right-click a collection to copy it, then paste it into another database or another connection, with merge, overwrite or replace for a target that already exists.
          - **An expanded document editor.** A full screen editor for a document, from the list, table or JSON view, with find-in-document ready on open and the document shown unfolded rather than collapsed.
          - **A visual query builder beside the documents list.** Drop fields into Query, Projection or Sort and it compiles them into a real query, written into the normal query bar inputs. Includes a **contains** operator for case insensitive text search, so a substring does not have to be written as a regex.
          - **Join a collection in another database.** `$lookup` cannot reach outside the database it runs in, so a pipeline can name one explicitly and Compass resolves it: `from: { db: "sales", coll: "regions" }`. The assistant knows the syntax, so it can be asked for in plain language. The joined collection is carried inside the query, so it suits reference tables rather than large collections, and anything too big is reported with its size.
          - **Drag fields out of documents.** A field name or value can be dragged from any of the three views, and dropped onto the query bar to filter by it. Two fields combine with `$and`.

          ## One behaviour change

          Double-clicking no longer puts a document into edit mode, because it was too easy to do by accident. Use right-click then Edit document, or the Edit action on the row.

          ## Installing

          Download the `.zip` below, unpack it anywhere, and run `CompassQueryBuilder.exe` inside. Nothing is installed and no administrator rights are needed, so it sits alongside any MongoDB Compass you already have without disturbing it.

          ## Things to know

          - **Unsigned.** Windows SmartScreen will warn on first run: click More info, then Run anyway.
          - **Collection History is a convenience, not a backup.** Snapshots are kept on your own machine, capped at 500 entries, and a bulk delete is only covered for its first 1000 documents. Do not rely on it for anything that matters.
          - **Third party licence notices are a placeholder.** They are produced by MongoDB's release system, which a fork cannot reach. Fine for personal and team use, not for public redistribution.
          - **SSPL v1**, the same licence as upstream Compass.
          - Not affiliated with or endorsed by MongoDB, Inc.
          NOTICE

          TAG="${{ github.event.inputs.tag }}"
          REPO="${{ github.repository }}"

          # Add the files to the release when the tag already exists, create
          # it otherwise, so the same workflow can publish a first build or
          # add another form of the same one.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists; adding the files to it"
            gh release upload "$TAG" installer/* --repo "$REPO" --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" \
              --repo "$REPO" \
              --target main \
              --title "${{ github.event.inputs.title }} $TAG" \
              --notes-file notes.md \
              installer/*
          fi
